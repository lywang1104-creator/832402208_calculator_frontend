<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend-Backend Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🧮 Calculator</h1>
        <p class="subtitle">All computation done on the backend &middot; safe, no eval()</p>

        <!-- Calculator main panel -->
        <div class="calculator">
            <!-- Display area -->
            <div class="display">
                <div class="expression" id="expression">0</div>
                <div class="result" id="result">Awaiting input&hellip;</div>
            </div>

            <!-- Button panel -->
            <div class="buttons">
                <!-- Row 1: function keys -->
                <button class="btn btn-clear" data-action="clear">AC</button>
                <button class="btn btn-func" data-action="backspace">⌫</button>
                <button class="btn btn-func" data-value="(">(</button>
                <button class="btn btn-func" data-value=")">)</button>

                <!-- Row 2 -->
                <button class="btn btn-num" data-value="7">7</button>
                <button class="btn btn-num" data-value="8">8</button>
                <button class="btn btn-num" data-value="9">9</button>
                <button class="btn btn-op" data-value="/">÷</button>

                <!-- Row 3 -->
                <button class="btn btn-num" data-value="4">4</button>
                <button class="btn btn-num" data-value="5">5</button>
                <button class="btn btn-num" data-value="6">6</button>
                <button class="btn btn-op" data-value="*">×</button>

                <!-- Row 4 -->
                <button class="btn btn-num" data-value="1">1</button>
                <button class="btn btn-num" data-value="2">2</button>
                <button class="btn btn-num" data-value="3">3</button>
                <button class="btn btn-op" data-value="-">−</button>

                <!-- Row 5 -->
                <button class="btn btn-num zero" data-value="0">0</button>
                <button class="btn btn-num" data-value=".">.</button>
                <button class="btn btn-op" data-value="+">+</button>
                <button class="btn btn-equal" data-action="equal">=</button>
            </div>
        </div>

        <!-- History panel -->
        <div class="history-section">
            <div class="history-header">
                <h2>📜 History</h2>
                <button class="btn btn-clear-all" id="clearAllBtn">Clear All</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">No history yet</div>
            </div>
        </div>
        <footer class="footer">
            <small>Keyboard: digits &middot; + - * / &middot; ( ) &middot; Enter = compute &middot; Esc = clear &middot; Backspace = backspace</small>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
